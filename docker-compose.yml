services:
  cash:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - ./cash:/data

  db:
    image: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./DB:/var/lib/postgresql/18/docker

  email:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  fastapi:
    build:
      context: .
      network: host
    volumes:
      - .:/app
    ports:
      - 8000:8000
    environment:
      - POSTGRES_HOST=db
    env_file:
      - .env
    depends_on:
      - db


volumes:
  redis_data:
  postgres-data:
