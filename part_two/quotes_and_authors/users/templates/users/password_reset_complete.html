{% extends 'quotes_and_authors/base.html' %}

{% block title %}
<title>Password Reset Complete</title>
{% endblock %}

{% block content %}
<div class="container mt-4">
	<div class="row justify-content-center">
		<div class="col-lg-5">
			<div class="card shadow-sm">
				<div class="card-header">
					<h4 class="mb-0">Password Reset Complete</h4>
				</div>

				<div class="card-body">
					<p>Your password has been successfully changed.</p>

					<a href="{% url 'users:login' %}" class="btn btn-primary w-100">
						Login
					</a>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}
