{% extends 'quotes_and_authors/base.html' %}

{% block title %}
    <title>{{ author.fullname }}</title>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title mb-3">
                        {{ author.fullname }}
                    </h1>

                    <div class="mb-3">
                        <span class="badge text-bg-secondary">
                            {{ author.born_date }}
                        </span>
                    </div>

                    <p class="text-muted mb-4">
                        {{ author.born_location }}
                    </p>

                    <hr>

                    <p class="card-text">
                        {{ author.description }}
                    </p>

                    <a href="{% url 'authors:authors' %}" class="btn btn-outline-secondary mt-3">
                        Back to authors
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
