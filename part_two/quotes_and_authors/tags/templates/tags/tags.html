{% extends 'quotes_and_authors/base.html' %}

{% block title %}
    <title>Tags</title>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Tags</h1>

        {% if user.is_authenticated %}
            <a href="{% url 'tags:add_tag' %}" class="btn btn-primary">
                Add tag
            </a>
        {% endif %}
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex flex-wrap gap-2">
                {% for tag in tags %}
                    <a href="{% url 'quotes:quotes_tags' tag.id %}" class="badge text-bg-secondary text-decoration-none fs-6">
                        #{{ tag.name }}
                    </a>
                {% empty %}
                    <div class="alert alert-info mb-0 w-100">
                        No tags yet.
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
