{% extends 'quotes_and_authors/base.html' %}

{% block title %}
    <title>Add tag</title>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0">Add tag</h4>
                </div>

                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="{{ form.name.id_for_label }}" class="form-label">Tag name</label>
                            {{ form.name }}
                            <div class="text-danger small">{{ form.name.errors }}</div>
                        </div>

                        <button type="submit" class="btn btn-primary">Save tag</button>
                        <a href="{% url 'tags:tags' %}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
