services:
  db:
    image: postgres:18
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_IP}:${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - ./DB:/var/lib/postgresql/18/docker
    networks:
      - app_network

  django:
    build:
      context: ..
      dockerfile: part_part/Dockerfile
      network: host
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_CONTAINER_PORT}/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - app_network

networks:
  app_network:
    driver: bridge