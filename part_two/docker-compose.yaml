services:
  db:
    image: postgres:18
    env_file:
      - .env

    ports:
      - "${POSTGRES_HOST_IP}:${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - app_network

  email:
    image: mailhog/mailhog
    ports:
      - "${MAIL_HOST_IP}:${MAIL_PORT_SMTP}:${MAIL_CONTAINER_PORT_SMTP}" # SMTP
      - "${MAIL_HOST_IP}:${MAIL_PORT_HTTP}:${MAIL_CONTAINER_PORT_HTTP}" # Web UI / API
    networks:
      - app_network

  django:
    build:
      context: ..
      dockerfile: part_two/Dockerfile
      network: host

    volumes:
      - ./quotes_and_authors:/app

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      POSTGRES_HOST_IP: db
      POSTGRES_PORT: ${POSTGRES_CONTAINER_PORT}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app_network


networks:
  app_network:
    driver: bridge


volumes:
  postgres_data: